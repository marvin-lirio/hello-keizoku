<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Developer Profile | Keizoku DevOps</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1115;
            color: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            width: min(700px, 90%);
        }

        .eyebrow {
            color: #8f98a8;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(42px, 7vw, 72px);
            margin: 0 0 20px;
        }

        p {
            color: #b6bcc8;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        a {
            display: inline-block;
            padding: 12px 20px;
            border: 1px solid #343b49;
            border-radius: 8px;
            color: #f5f5f5;
            text-decoration: none;
            transition: 0.2s ease;
        }

        a:hover {
            transform: translateY(-2px);
            border-color: #5b6575;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="eyebrow">
            Keizoku DevOps
        </div>

        <h1>Developer Profile</h1>

        <p>
            Resume, project history and technical experience are currently
            being assembled into a dedicated portfolio.
        </p>

        <a href="index.html">
            Back to Keizoku
        </a>

    </main>

</body>
</html>
